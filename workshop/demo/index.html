<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nutrition Checker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">
    <header class="hero">
      <h1>Nutrition Checker</h1>
      <p class="subtitle">Search any food to see calories, macros, and serving size in seconds.</p>
    </header>

    <section class="search-panel">
      <form id="search-form" class="search-form">
        <div class="search-row">
          <div class="field field--quantity">
            <label class="search-label" for="quantity-input">Quantity</label>
            <input
              type="number"
              id="quantity-input"
              min="0.1"
              step="0.1"
              value="1"
              required
            >
          </div>
          <div class="field field--food">
            <label class="search-label" for="search-input">Food name</label>
            <input
              type="text"
              id="search-input"
              placeholder="Try avocado, banana, or chicken"
              autocomplete="off"
              required
            >
          </div>
          <button type="submit">Search</button>
        </div>
      </form>
    </section>

    <p id="loading" class="message loading" role="status" aria-live="polite" hidden>
      <span class="spinner" aria-hidden="true"></span>
      <span>Loading nutrition data...</span>
    </p>

    <p id="error" class="message error" role="alert" aria-live="assertive" hidden>
      <span id="error-text"></span>
    </p>

    <main id="results" hidden></main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
